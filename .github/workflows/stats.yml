name: Estadisticas reales (OP3)

on:
  schedule:
    - cron: "17 6 * * *"   # todos los dias, ~1 am Mexico
  workflow_dispatch:
  push:
    paths:
      - "scripts/op3_stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-op3
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contar escuchas reales de todos los shows
        env:
          OP3_TOKEN: ${{ secrets.OP3_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/op3_stats.mjs
      - name: Guardar en el repo
        run: |
          git config user.name "robot-estadisticas"
          git config user.email "actions@users.noreply.github.com"
          git add stats_op3.json historial_op3.json
          git diff --cached --quiet && exit 0
          git commit -m "Robot: estadisticas OP3 $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
